services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wgcook
      POSTGRES_PASSWORD: wgcook
      POSTGRES_DB: wgcook
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wgcook -d wgcook"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://wgcook:wgcook@db:5432/wgcook
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
