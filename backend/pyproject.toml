[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = [
    # Docstrings: Docstrings sind nicht vereinbart
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
